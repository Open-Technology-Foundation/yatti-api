# YaTTi Shell — SSH configuration for sandboxed YaTTi users
# Install to: /etc/ssh/sshd_config.d/50-yatti-shell.conf

Match Group yatti-shell
    ForceCommand /usr/local/bin/yatti-shell-gate
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    MaxSessions 3
